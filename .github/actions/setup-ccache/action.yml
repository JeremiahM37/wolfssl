name: 'Set up ccache'
description: 'Install ccache, configure it as the C compiler driver, and restore/save the cache across runs'
inputs:
  key:
    description: 'Workflow-scope cache key (typically the workflow name). Combined with runner.os + arch.'
    required: false
    default: 'default'
  matrix-key:
    description: 'Per-matrix-entry scope. Pass strategy.job-index or a hash of matrix.config so each entry caches independently. Leave empty for single-job workflows.'
    required: false
    default: ''
  max-size:
    description: 'ccache max size (e.g. 500M, 2G). Default keeps GHA cache budget reasonable.'
    required: false
    default: '500M'
  install:
    description: 'Install ccache via apt if not present.'
    required: false
    default: 'true'
outputs:
  cache-hit:
    description: 'Whether the ccache restore step found a matching cache.'
    value: ${{ steps.cache-restore.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    - name: Install ccache
      if: inputs.install == 'true'
      shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends ccache
          elif command -v brew >/dev/null 2>&1; then
            brew install ccache
          else
            echo "::error::ccache not present and no supported package manager found"
            exit 1
          fi
        fi
        ccache --version | head -1

    - name: Configure ccache
      shell: bash
      run: |
        ccache --set-config=max_size=${{ inputs.max-size }}
        ccache --set-config=compression=true
        ccache --set-config=compression_level=1
        # ccache hashes the source contents (direct mode) and only falls back
        # to preprocessed mode on mismatch. The defaults are fine; print them
        # so cache misses are easy to debug in workflow logs.
        ccache -p | grep -E "max_size|compression|cache_dir" || true

    - name: Compute cache key
      id: keys
      shell: bash
      run: |
        BASE="ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}"
        if [ -n "${{ inputs.matrix-key }}" ]; then
          BASE="${BASE}-mx${{ inputs.matrix-key }}"
        fi
        echo "primary=${BASE}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        # Restore-keys cascade: most-specific first.
        {
          echo "restore<<EOF"
          echo "${BASE}-"
          echo "ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-"
          echo "ccache-${{ runner.os }}-${{ runner.arch }}-"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore/save ccache (post-step saves at job end)
      id: cache-restore
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ steps.keys.outputs.primary }}
        restore-keys: ${{ steps.keys.outputs.restore }}

    - name: Reset ccache stats for this run
      shell: bash
      run: ccache -z >/dev/null

    - name: Export ccache compiler shims
      shell: bash
      run: |
        # Prepend ccache's compiler symlinks dir to PATH so `gcc`/`clang`/`g++`
        # invocations transparently route through ccache without configure
        # needing to know about it. This matches how Debian/Ubuntu ship ccache.
        if [ -d /usr/lib/ccache ]; then
            echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        else
            # macOS / homebrew layout
            CCACHE_LIBEXEC=$(ccache --print-config 2>/dev/null | awk -F= '/^libexec_dir/{print $2}' | tr -d ' ' || true)
            if [ -n "$CCACHE_LIBEXEC" ] && [ -d "$CCACHE_LIBEXEC" ]; then
                echo "$CCACHE_LIBEXEC" >> "$GITHUB_PATH"
            fi
        fi

    - name: Post — print ccache stats
      shell: bash
      if: always()
      run: |
        echo "::group::ccache stats after build"
        ccache -s || true
        echo "::endgroup::"
